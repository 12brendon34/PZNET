name: CMake on multiple platforms

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu x86_64 (GCC)
            os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            artifact_name: ZNetNoSteam64-linux-x86_64
          - name: Windows x86_64 (MSVC)
            os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            artifact_name: ZNetNoSteam64-windows-x86_64

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Configure CMake
      run: >
        cmake -B build
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release --parallel

    - name: Stage artifacts (Linux)
      if: runner.os == 'Linux'
      run: |
        mkdir dist
        cp build/libZNetNoSteam64.so dist/
        cp build/third_party/raknet/libRakNet64.so dist/

    - name: Stage artifacts (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory -Path dist | Out-Null
        Copy-Item build/Release/ZNetNoSteam64.dll dist/
        Copy-Item build/third_party/raknet/Release/RakNet64.dll dist/

    - name: Upload libraries
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: dist/
        if-no-files-found: error
